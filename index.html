<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Myntra</title>
   <link 
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
   />
   <link rel="icon" href="/Projects/E-Commerce Project/myntra-favicon-logo.png">
   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
   <div class="flex h-full bg-gray-200">
      <aside class="w-72 fixed top-14 left-0 h-[calc(100vh-3rem)] overflow-y-auto bg-white ">
         <div class="flex justify-between items-center pl-5 py-3 pr-3">
            <h4 class="font-homo font-bold text-lg">FILTERS</h4>
            <h4 class="text-red-500 font-bold font-homo cursor-pointer" id="clear-filters">CLEAR ALL</h4>
         </div>
         <hr class="border border-solid border-gray-100">
         <div class="pl-5 my-3">
            <span class="text-md block mb-3 font-bold font-homo">CATEGORIES</span>
            <div class="w-full flex justify-start items-center gap-x-3">
               <input type="checkbox" class="text-xl category text-gray-600" value="beauty">
               <label class="text-md text-gray-600">Beauty</label>
            </div>
            <div class="w-full flex justify-start items-center gap-x-3">
               <input type="checkbox" class="text-xl category text-gray-600" value="groceries">
               <label class="text-md text-gray-600">Groceries</label>
            </div>
            <div class="w-full flex justify-start items-center gap-x-3">
               <input type="checkbox" class="text-xl category text-gray-600" value="furniture">
               <label class="text-md text-gray-600">Furniture</label>
            </div>
            <div class="w-full flex justify-start items-center gap-x-3">
               <input type="checkbox" class="text-xl category text-gray-600" value="fragrances">
               <label class="text-md text-gray-600">Fragrances</label>
            </div>
         </div>

         
         <hr class="border border-solid border-gray-100 mt-2">
         <div class="pl-5 my-3">
               <span class="text-md block mb-3 font-bold font-homo">RATING</span>
               <div class="w-full flex justify-start items-center gap-x-3">
                  <input type="checkbox" class="text-xl rating text-gray-600" value="5">
                  <label class="text-md text-gray-600">5 Stars</label>
               </div>
               <div class="w-full flex justify-start items-center gap-x-3">
                  <input type="checkbox" class="text-xl rating text-gray-600" value="4">
                  <label class="text-md text-gray-600">4 Stars and Above</label>
               </div>
               <div class="w-full flex justify-start items-center gap-x-3">
                  <input type="checkbox" class="text-xl rating text-gray-600" value="3">
                  <label class="text-md text-gray-600">3 Stars and Above</label>
               </div>
               <div class="w-full flex justify-start items-center gap-x-3">
                  <input type="checkbox" class="text-xl rating text-gray-600" value="2">
                  <label class="text-md text-gray-600">2 Stars and Above</label>
               </div>
               <div class="w-full flex justify-start items-center gap-x-3">
                  <input type="checkbox" class="text-xl rating text-gray-600" value="1">
                  <label class="text-md text-gray-600">1 Stars and Above</label>
               </div>
         </div>

         

         

      </aside>
      <section class="ml-72 flex-1 overflow-y-auto">
         <nav class="fixed top-0 left-0 right-0 h-15 bg-white shadow flex justify-between items-center z-1 p-4">
            <img src="myntra-logo.png" alt="" class="w-25 h-auto">
            <div class="flex justify-center items-center gap-6 p-3 mr-4 relative">
               <input type="text" placeholder="Search for Products, Brands and More" class="py-2 px-11 bg-gray-100 w-[520px] outline-none placeholder-gray-400 text-gray-500 font-semibold rounded-2xl" id="search-input">
               <i class="ri-search-line absolute top-5 left-7 text-gray-500 font-semibold"></i>
               <button class="bg-slate-100 rounded-full w-10 h-10 p-2 flex items-center justify-center">
                  <i class="ri-heart-line text-2xl"></i>
               </button>

               <button class="bg-slate-100 rounded-full w-10 h-10 p-2 flex items-center justify-center">
                  <i class="ri-user-line text-2xl"></i>
               </button>

               <button class="cursor-pointer bg-slate-100 rounded-full w-10 h-10 p-2 flex items-center justify-center" id="cart-btn">
                  <i class="ri-shopping-bag-line relative text-2xl "></i>
                  <small class="bg-red-400 text-white rounded-full absolute top-3 right-2 w-6 h-6 flex justify-center items-center" id="cart-count">1</small>
               </button>
            </div>
         </nav>
         <div 
            id="products-container"
            class="min-h-screen flex flex-wrap justify-start items-start gap-4 mx-auto p-4 mt-15"
            >
         </div>

         <!-- Overlay Effect -->
         <div
            id="cart-overlay"
            class="fixed inset-0 bg-black/50 opacity-0 invisible transition-all duration-300 z-40"
         ></div>

         <!-- Shopping Cart Drawer -->
         <aside class="w-85 fixed top-0 right-0 h-[100vh] overflow-y-auto bg-white z-50 shadow-md p-2 translate-x-full
           transition-transform duration-300 ease-in-out" id="cart-drawer">
         <div class="flex justify-between items-center pl-5 py-3 pr-3 relative">
            <h4 class="font-homo font-bold text-md text-gray-500">CART</h4>
            <span class="[clip-path: polygon(50% 0%, 100% 0, 100% 72%, 47% 72%, 0% 38%)] text-[11px] font-[400] py-1 px-2 rounded-sm bg-[#FFD100] flex justify-center items-center text-black shadow-sm absolute top-4 left-18" id="cart-items-count">3 Items</span>
            <button id="close-cart">
               <i class="ri-close-line text-2xl font-bold text-red-500"></i>
            </button>
            
         </div>
         <hr class="border border-solid border-gray-100">
         <div class="pl-5 my-3 flex flex-col gap-y-4 max-h-[500px] overflow-y-auto" id="cart-container">
            <div class="flex gap-4">
               <img src="shopping-cart-demo-picture.jpg" alt="" class="w-25 h-auto">
               <div class="flex flex-col gap-y-4">
                  <span class="font-[700] text-[12px] text-black">Plush Pet Sleeping Mat</span>
                  <span class="font-[700] text-[12px] text-black">₹ 30.00</span>
                  <div class="flex gap-x-2">
                     <button class="cursor-pointer hover:bg-gray-200 transition duration-300 w-6 h-6 rounded-full flex items-center justify-center">
                        <i class="ri-subtract-line"></i>
                     </button>
                     <span class="w-6 h-6 rounded-full flex items-center justify-center">1</span>
                     <button class="cursor-pointer hover:bg-gray-200 transition duration-300 w-6 h-6 rounded-full flex items-center justify-center">
                        <i class="ri-add-line"></i>
                     </button>
                     <button class="cursor-pointer hover:bg-red-500 hover:text-white transition duration-300 w-6 h-6 rounded-full flex items-center justify-center">
                        <i class="ri-delete-bin-line"></i>
                     </button>
                  </div>
               </div>
            </div>

            <div class="flex gap-4">
               <img src="shopping-cart-demo-picture.jpg" alt="" class="w-25 h-auto">
               <div class="flex flex-col gap-y-4">
                  <span class="font-[700] text-[12px] text-black">Plush Pet Sleeping Mat</span>
                  <span class="font-[700] text-[12px] text-black">₹ 30.00</span>
                  <div class="flex gap-x-2">
                     <button class="cursor-pointer hover:bg-gray-200 transition duration-300 w-6 h-6 rounded-full flex items-center justify-center">
                        <i class="ri-subtract-line"></i>
                     </button>
                     <span class="w-6 h-6 rounded-full flex items-center justify-center">1</span>
                     <button class="cursor-pointer hover:bg-gray-200 transition duration-300 w-6 h-6 rounded-full flex items-center justify-center">
                        <i class="ri-add-line"></i>
                     </button>
                     <button class="cursor-pointer hover:bg-red-500 hover:text-white transition duration-300 w-6 h-6 rounded-full flex items-center justify-center">
                        <i class="ri-delete-bin-line"></i>
                     </button>
                  </div>
               </div>
            </div>

            <div class="flex gap-4">
               <img src="shopping-cart-demo-picture.jpg" alt="" class="w-25 h-auto">
               <div class="flex flex-col gap-y-4">
                  <span class="font-[700] text-[12px] text-black">Plush Pet Sleeping Mat</span>
                  <span class="font-[700] text-[12px] text-black"> ₹30.00</span>
                  <div class="flex gap-x-2">
                     <button class="cursor-pointer hover:bg-gray-200 transition duration-300 w-6 h-6 rounded-full flex items-center justify-center">
                        <i class="ri-subtract-line"></i>
                     </button>
                     <span class="w-6 h-6 rounded-full flex items-center justify-center">1</span>
                     <button class="cursor-pointer hover:bg-gray-200 transition duration-300 w-6 h-6 rounded-full flex items-center justify-center">
                        <i class="ri-add-line"></i>
                     </button>
                     <button class="cursor-pointer hover:bg-red-500 hover:text-white transition duration-300 w-6 h-6 rounded-full flex items-center justify-center">
                        <i class="ri-delete-bin-line"></i>
                     </button>
                  </div>
               </div>
            </div>

            <div class="flex gap-4">
               <img src="shopping-cart-demo-picture.jpg" alt="" class="w-25 h-auto">
               <div class="flex flex-col gap-y-4">
                  <span class="font-[700] text-[12px] text-black">Plush Pet Sleeping Mat</span>
                  <span class="font-[700] text-[12px] text-black"> ₹30.00</span>
                  <div class="flex gap-x-2">
                     <button class="cursor-pointer hover:bg-gray-200 transition duration-300 w-6 h-6 rounded-full flex items-center justify-center">
                        <i class="ri-subtract-line"></i>
                     </button>
                     <span class="w-6 h-6 rounded-full flex items-center justify-center">1</span>
                     <button class="cursor-pointer hover:bg-gray-200 transition duration-300 w-6 h-6 rounded-full flex items-center justify-center">
                        <i class="ri-add-line"></i>
                     </button>
                     <button class="cursor-pointer hover:bg-red-500 hover:text-white transition duration-300 w-6 h-6 rounded-full flex items-center justify-center">
                        <i class="ri-delete-bin-line"></i>
                     </button>
                  </div>
               </div>
            </div>


         </div>

         <div class="px-5 mt-10 flex justify-between items-center gap-2">
            <label class="text-[#1F2937] font-[800] text-[12px]" >TOTAL :</label>
            <span class="text-[#1F2937] font-[800] text-[16px]" id="cart-total">₹ 100.00</span>
         </div>
         <button class="px-5 py-2 cursor-pointer scale-100 hover:scale-[1.02] transition-transform duration-300 ease-in-out mt-2 bg-red-500 font-[700] text-[16px] border-none outline-none text-white w-full">Proceed to Checkout</button>
         </aside>

      </section>
   </div>
   <script src="script.js"></script>
</body>
</html>
